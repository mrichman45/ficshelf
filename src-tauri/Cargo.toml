[package]
name = "ficshelf"
version = "1.2.0"
description = "A local reading library for EPUB, PDF and CBZ, with an AO3 fetcher"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ficshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Reads the content:// links Android's file picker hands back.
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "cookies"] }
scraper = "0.20"
url = "2"

rusqlite = { version = "0.32", features = ["bundled"] }

zip = { version = "2", default-features = false, features = ["deflate"] }
# Cover thumbnails (decode the common formats, write JPEG).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Comics kept as RAR (CBR) and 7-Zip (CB7).
unrar = "0.5"
sevenz-rust = "0.6"
quick-xml = "0.36"
percent-encoding = "2"

anyhow = "1"
thiserror = "1"
base64 = "0.22"

# The AO3 password is kept in the operating system's own credential store —
# KDE Wallet or GNOME Keyring on Linux, Credential Manager on Windows — and
# never in this app's database or config. keyring has no Android backend, so
# on phones the app signs in for the session only and stores nothing.
#
# Each platform needs its native feature named here: without one, keyring 3
# silently falls back to an in-memory mock and the password is lost on exit.
# crypto-rust encrypts the password on its way over D-Bus to the Secret Service.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[features]
# Tauri wants this when building without the default custom-protocol feature
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# `nodeps` is set only when the dependency-free modules are tested on their
# own, outside the app.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nodeps)'] }
