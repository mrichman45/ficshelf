name: build

# Builds FicShelf for all three platforms, each in its own clearly named
# download:
#
#   FicShelf-Windows   .exe installer (recommended) and .msi
#   FicShelf-Linux     .AppImage (any distro), .deb (Ubuntu/Mint/Debian),
#                      and an Arch/CachyOS tarball for install-local.sh
#   FicShelf-Android   signed .apk for 64-bit ARM phones
#
# Run it from the Actions tab. Pushing a tag such as v0.1.0 also publishes a
# GitHub Release with every file attached and labelled.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in package.json"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  # The dependency-free parts (AO3 page reading, EPUB building, sync merging,
  # podfic tags, cooldowns) have their own tests; a release is only published
  # when they pass.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        working-directory: src-tauri/tests-pure
        env:
          RUSTFLAGS: --cfg nodeps
        run: cargo test --lib

  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            bundles: deb,appimage
          - os: windows-latest
            label: Windows
            bundles: msi,nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux needs WebKitGTK and friends. 22.04 is used rather than a
      # newer image because binaries built against an older glibc run on newer
      # systems (CachyOS included), and not the other way round.
      - name: Install Linux build dependencies
        if: matrix.label == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Every icon size for every platform comes from icons/icon.png, so
      # replacing that one file changes the icon everywhere.
      - name: Icons
        run: npm run tauri icon -- src-tauri/icons/icon.png

      - name: Build
        uses: tauri-apps/tauri-action@v0
        # Google Drive sync: the OAuth client FicShelf identifies itself as.
        # Without these the app builds fine, with sync shown as not set up.
        env:
          FICSHELF_GOOGLE_CLIENT_ID: ${{ secrets.FICSHELF_GOOGLE_CLIENT_ID }}
          FICSHELF_ANILIST_CLIENT_ID: ${{ secrets.FICSHELF_ANILIST_CLIENT_ID }}
          FICSHELF_MAL_CLIENT_ID: ${{ secrets.FICSHELF_MAL_CLIENT_ID }}
          FICSHELF_GOOGLE_CLIENT_SECRET: ${{ secrets.FICSHELF_GOOGLE_CLIENT_SECRET }}
          FICSHELF_REPORT_EMAIL: ${{ secrets.FICSHELF_REPORT_EMAIL }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Gather Windows files
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/

      - name: Gather Linux files
        if: matrix.label == 'Linux'
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          cp src-tauri/target/release/bundle/deb/*.deb out/
          # The plain program, laid out the way install-local.sh expects.
          version=$(node -p "require('./package.json').version")
          tar czf "out/FicShelf_${version}_linux-arch-cachyos.tar.gz" \
            install-local.sh src-tauri/icons src-tauri/target/release/ficshelf

      - uses: actions/upload-artifact@v4
        with:
          name: FicShelf-${{ matrix.label }}
          if-no-files-found: error
          path: out/*

  android:
    name: Android
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already carries the Android SDK at $ANDROID_HOME;
      # only the pieces this build pins need adding.
      - name: Install the NDK and SDK platform
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: Android

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build
        env:
          FICSHELF_GOOGLE_CLIENT_ID: ${{ secrets.FICSHELF_GOOGLE_CLIENT_ID }}
          FICSHELF_ANILIST_CLIENT_ID: ${{ secrets.FICSHELF_ANILIST_CLIENT_ID }}
          FICSHELF_MAL_CLIENT_ID: ${{ secrets.FICSHELF_MAL_CLIENT_ID }}
          FICSHELF_GOOGLE_CLIENT_SECRET: ${{ secrets.FICSHELF_GOOGLE_CLIENT_SECRET }}
          FICSHELF_REPORT_EMAIL: ${{ secrets.FICSHELF_REPORT_EMAIL }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npm run tauri android init -- --ci
          # The launcher icon: without this the APK carries Tauri's default
          # logo. `tauri icon` writes every Android size (and the round and
          # adaptive variants) into the project just generated. Android crops
          # icons to the phone's own shape, so it gets an edge-to-edge
          # version of the shelf (android-icon.png) rather than the rounded
          # desktop one.
          npm run tauri icon -- src-tauri/icons/android-icon.png
          python3 scripts/patch-android.py
          npm run tauri android build -- --apk --target aarch64 --ci

      # Every build is signed with the same key, kept as repository secrets,
      # so a new APK installs over the old one and keeps the phone's library.
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; cannot sign the APK."
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "Signing $unsigned"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias ficshelf \
            --out "out/FicShelf_${version}_android-arm64.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "out/FicShelf_${version}_android-arm64.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: FicShelf-Android
          if-no-files-found: error
          path: out/*.apk

  release:
    name: Publish release
    # A pushed v* tag, or a hand-started run with "release" ticked (which
    # tags the commit itself, for when a tag cannot be pushed from where you
    # are).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [tests, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          # This version's section of CHANGES.md, if it has one, goes first.
          VERSION="${TAG#v}"
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{on=0} on' CHANGES.md > notes.md || true
          if [ -s notes.md ]; then
            { echo "## What's new"; cat notes.md; echo; } > notes.tmp && mv notes.tmp notes.md
          fi
          cat >> notes.md <<'EOF'
          ## Which file do I want?

          **Windows**
          - `FicShelf_…_x64-setup.exe`: the installer. Download it and run it.
          - `FicShelf_…_x64_en-US.msi`: the same thing as an MSI, if you prefer it.

          **Linux**
          - `FicShelf_…_linux-arch-cachyos.tar.gz`: Arch and CachyOS. Unpack it and run `sudo ./install-local.sh`.
          - `FicShelf_…_amd64.AppImage`: any distro. Make it executable and run it.
          - `FicShelf_…_amd64.deb`: Ubuntu, Mint, Pop!_OS and Debian.

          **Android**
          - `FicShelf_…_android-arm64.apk`: Galaxy and other 64-bit ARM phones. Open it on the phone and allow installing from this source when asked.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FicShelf $TAG" --notes-file notes.md \
            dist/FicShelf-Windows/* dist/FicShelf-Linux/* dist/FicShelf-Android/*
